<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CAT12 Pipeline UI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/layout.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/forms.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/console.css') }}" rel="stylesheet">
</head>
<body>
  {% include 'components/navbar.html' %}

  <main class="container-fluid px-4 py-3 app-main">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
