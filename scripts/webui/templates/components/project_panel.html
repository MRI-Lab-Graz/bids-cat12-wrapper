<section class="card panel-card mb-3">
  <div class="card-header">
    <strong><i class="fas fa-folder-open me-2"></i>Project</strong>
  </div>
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-9">
        <label class="form-label">Project file</label>
        <input id="projectPath" type="text" class="form-control" placeholder="projects/webui/project.json">
      </div>
      <div class="col-md-3 d-grid">
        <button id="btnLoadProject" class="btn btn-outline-primary">Load</button>
      </div>
      <div class="col-12 d-grid">
        <button id="btnBrowseProject" type="button" class="btn btn-outline-secondary">Browse project file...</button>
      </div>
      <div class="col-md-9">
        <label class="form-label">Config source path (for reference)</label>
        <input id="configPath" type="text" class="form-control" placeholder="config/config_14_2_26.json">
      </div>
      <div class="col-md-3 d-grid">
        <button id="btnSaveProject" class="btn btn-success">Save</button>
      </div>
      <div class="col-12 d-grid">
        <button id="btnBrowseConfig" type="button" class="btn btn-outline-secondary">Browse config file...</button>
      </div>
    </div>
    <div id="projectStatus" class="small text-muted mt-2"></div>
  </div>
</section>
